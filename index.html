<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Condomínio Lícia M. Santiago</title>
<style>
:root{--verde:#1d5fd1;--verde2:#5b93ee;--tint:#e8f0fd;--fundo:#f3f6fb;--card:#fff;--texto:#14213d;--suave:#5b6b82;--borda:#e1e8f2;--ok:#166534;--okbg:#e3f4e8;--av:#8a5a00;--avbg:#fbf0d4;--no:#9f1c1c;--nobg:#fbe4e4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.ic{flex:none;vertical-align:middle}
header.top{background:#fff;color:var(--texto);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;box-shadow:0 1px 0 var(--borda),0 4px 16px rgba(20,33,61,.04)}
header.top a.voltar{color:var(--verde);text-decoration:none;width:38px;height:38px;border-radius:11px;background:var(--tint);display:flex;align-items:center;justify-content:center}
header.top h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.1px;line-height:1.2}
header.top .sub{font-size:11.5px;color:var(--suave);font-weight:500;display:block;letter-spacing:.4px;text-transform:uppercase}
header.top .logo{color:var(--verde);display:flex}
header.top .vdiv{width:1px;height:34px;background:var(--borda)}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
.hero{text-align:center;padding:10px 0 2px}
.hero h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.3px}
.hero h2::after{content:"";display:block;width:44px;height:3px;background:var(--verde);border-radius:3px;margin:10px auto 0}
.hero p{margin:12px 0 0;color:var(--suave);font-size:15px}
.busca{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--borda);border-radius:14px;padding:0 14px;margin:18px 0 18px;box-shadow:0 2px 10px rgba(20,33,61,.05)}
.busca .ic{color:var(--suave)}
.busca input{border:0;border-radius:0;padding:15px 0;background:transparent;outline:none;font-size:16px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:520px){.grid{grid-template-columns:1fr 1fr}}
.tile{display:flex;flex-direction:row;align-items:center;gap:14px;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--texto);box-shadow:0 1px 2px rgba(20,33,61,.04),0 6px 16px rgba(20,33,61,.04)}
.tile:active{background:#eef3fc}
.tile .tx{flex:1;min-width:0}
.tile .chev{color:#9aa8bd;display:flex}
.tile .t{font-weight:650;font-size:16px;line-height:1.25}
.tile .s{font-size:13.5px;color:var(--suave);margin-top:2px;line-height:1.3}
.chipic{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--verde);display:flex;align-items:center;justify-content:center;flex:none}
.chipic.sm{width:36px;height:36px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:16.5px;font-weight:600}
.cardhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.cardhead h3{margin:0}
.muted{color:var(--suave);font-size:14px}
.fonte{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;color:var(--verde);background:var(--tint);padding:3px 10px;border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--verde);color:#fff;border:0;border-radius:12px;padding:13px 16px;font-size:15.5px;font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--tint);color:var(--verde)}
.btn.zap{background:#1b7f4b}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1;min-width:130px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #cdd6d3;border-radius:12px;background:#fff;color:var(--texto)}
label{display:block;font-size:13.5px;font-weight:600;margin:12px 0 4px;color:#33464a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #cdd6d3;background:#fff;border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--texto)}
.chip.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.nav{display:grid;grid-template-columns:48px 1fr 96px 48px;gap:8px;margin-bottom:12px}
.nav button{border:1px solid #cdd6d3;background:#fff;border-radius:12px;cursor:pointer;color:var(--verde);display:flex;align-items:center;justify-content:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--suave);padding:4px 0;font-weight:600}
.cal .d{aspect-ratio:1;border:1px solid var(--borda);background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;cursor:pointer;font-family:inherit;color:var(--texto);padding:0}
.cal .d.hoje{border-color:var(--verde);border-width:2px;font-weight:700}
.cal .d.res{background:#fdf3d8}
.cal .d.sel,.cal .d.res.sel{background:var(--verde);color:#fff}
.cal .d i{width:5px;height:5px;border-radius:50%;background:#c98a00;margin-top:2px;display:block}
.cal .d.sel i{background:#fff}
.res-item{border-left:4px solid var(--verde2);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;border-top:1px solid var(--borda);border-right:1px solid var(--borda);border-bottom:1px solid var(--borda)}
.res-item b{display:block}
.aviso{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 12px;margin-top:10px;font-size:14.5px}
.aviso .ic{margin-top:2px}
.aviso.av{background:var(--avbg);color:#5f3d00}
.aviso.ok{background:var(--okbg);color:#14532d}
.aviso.no{background:var(--nobg);color:#7f1d1d}
.aviso.info{background:var(--tint);color:#1b3a6b}
details.tema{background:#fff;border:1px solid var(--borda);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.tema summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;gap:12px;align-items:center}
details.tema summary::-webkit-details-marker{display:none}
details.tema summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--suave);border-bottom:2px solid var(--suave);transform:rotate(-45deg);transition:transform .2s}
details.tema[open] summary::after{transform:rotate(45deg)}
details.tema .corpo{padding:0 16px 8px}
.regra{border-top:1px solid var(--borda);padding:12px 0}
.regra b{display:block;margin-bottom:2px}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:650;font-size:13px;padding:4px 11px;border-radius:99px;margin-bottom:8px}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.av{background:var(--avbg);color:var(--av)}
.badge.no{background:var(--nobg);color:var(--no)}
.agora{background:var(--verde);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.agora small{display:block;opacity:.75;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.agora b{font-size:19px;font-weight:600}
.hrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--borda)}
.hrow:first-child{border-top:0}
.hrow b{display:block;font-size:15px}
.hrow span{font-size:14px;color:var(--suave)}
h3.sec{margin:20px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--suave);font-weight:650}
.pend{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:650;color:var(--av);background:var(--avbg);padding:3px 10px;border-radius:99px}
.card.conf{border-color:#b9cff7;background:#f4f8ff}
.msgbox{white-space:pre-wrap;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:12px;font-size:14px;line-height:1.45;max-height:260px;overflow:auto}
.rodape{text-align:center;color:var(--suave);font-size:12.5px;margin-top:24px}
</style>
</head>

const pad=n=>String(n).padStart(2,"0");

const br=iso=>iso.split("-").reverse().join("/");
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const digits=s=>String(s).replace(/\D/g,"");
function numWa(n){let d=digits(n);if(d&&d.length<=11)d="55"+d;return d}
function waLink(text,num){return "https://wa.me/"+(num?numWa(num):"")+"?text="+encodeURIComponent(text)}

function parseCSV(t){const rows=[];let row=[],cur="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===','){row.push(cur);cur=""}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=c}if(cur!==""||row.length){row.push(cur);rows.push(row)}return rows}
function isoData(s){s=String(s||"").trim();if(s.indexOf("/")>0){const p=s.split("/");if(p.length===3)return p[2].trim()+"-"+pad(p[1].trim())+"-"+pad(p[0].trim())}return s}
function hora(s){s=String(s||"").trim();const m=s.match(/^(\d{1,2})[:h](\d{2})?/);return m?pad(m[1])+":"+(m[2]||"00"):s}
async function carregarPlanilha(){
  if(!CONFIG.planilhaReservasCSV)return;
  try{
    const r=await fetch(CONFIG.planilhaReservasCSV,{cache:"no-store"});
    if(!r.ok)throw 0;
    const rows=parseCSV(await r.text());
    const h=rows[0].map(x=>norm(x).trim());
    const ix=n=>h.indexOf(n);
    reservas=rows.slice(1).filter(r=>r[ix("data")]).map(r=>({
      data:isoData(r[ix("data")]),inicio:hora(r[ix("inicio")]),fim:hora(r[ix("fim")]),
      espaco:(r[ix("espaco")]||"Outro").trim(),quem:(r[ix("quem")]||"").trim(),obs:(r[ix("obs")]||"").trim()
    }));
    statusAgenda="Agenda sincronizada com a planilha do condomínio.";
  }catch(e){statusAgenda="Não consegui atualizar a agenda agora. Mostrando a última lista salva na página."}
  if(location.hash.indexOf("agenda")>0)render();
}

function setDia(k){st.dia=(st.dia===k)?null:k;render();const e=$("listaRes");if(e&&st.dia)e.scrollIntoView({behavior:"smooth",block:"start"})}
function itemRes(r){
  return '<div class="res-item"><b>'+esc(r.espaco)+'</b>'+br(r.data)+' · '+esc(r.inicio)+' às '+esc(r.fim)+

}
function removerLocal(id){if(!confirm("Cancelar esta reserva?"))return;locais=locais.filter(r=>r.id!==id);salvarLocais();confirmacao=null;render()}
function msgMes(ano,mes,nova){
  const pre=ano+"-"+pad(mes+1);
  const l=todas().filter(r=>r.data.indexOf(pre)===0).sort((a,b)=>(a.data+a.inicio).localeCompare(b.data+b.inicio));
  let t="*Reservas de "+MESES[mes]+" de "+ano+"*\n\n";
  if(nova)t+="*Nova reserva:* "+nova.espaco+", dia "+br(nova.data)+", das "+nova.inicio+" às "+nova.fim+" ("+nova.quem+")"+(nova.obs?" – "+nova.obs:"")+"\nSíndico, pode confirmar?\n\n";
  t+="*Agenda do mês:*\n"+(l.length?l.map(r=>"• "+br(r.data).slice(0,5)+" · "+r.inicio+"–"+r.fim+" · "+r.espaco+(r.quem?" · "+r.quem:"")+(r.local?" (a confirmar)":"")).join("\n"):"Nenhuma reserva.");
  return t;
}

function copiarConf(){if(!confirmacao)return;const t=confirmacao.texto;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert("Mensagem copiada! Cole no grupo "+CONFIG.nomeGrupoReservas+".")).catch(()=>prompt("Copie a mensagem:",t))}

function vAgenda(){
  const anos=[];for(let a=hoje.getFullYear()-1;a<=hoje.getFullYear()+3;a++)anos.push(a);
  const first=new Date(st.ano,st.mes,1).getDay(),n=new Date(st.ano,st.mes+1,0).getDate();
  const filt=todas().filter(r=>st.filtro==="Todos"||r.espaco===st.filtro);
  const map={};filt.forEach(r=>{(map[r.data]=map[r.data]||[]).push(r)});
  let cells=["D","S","T","Q","Q","S","S"].map(x=>'<div class="h">'+x+'</div>').join("");
  for(let i=0;i<first;i++)cells+="<div></div>";
  for(let d=1;d<=n;d++){
    const k=key(st.ano,st.mes,d);
    const cls=["d",k===key(hoje.getFullYear(),hoje.getMonth(),hoje.getDate())?"hoje":"",map[k]?"res":"",st.dia===k?"sel":""].join(" ");
    cells+='<button class="'+cls+'" onclick="setDia(\''+k+'\')">'+d+(map[k]?"<i></i>":"")+'</button>';
  }
  const prefixo=st.ano+"-"+pad(st.mes+1);
  const lista=filt.filter(r=>st.dia?r.data===st.dia:r.data.indexOf(prefixo)===0).sort((a,b)=>(a.data+a.inicio).localeCompare(b.data+b.inicio));
  const titLista=st.dia?"Reservas em "+br(st.dia):"Reservas de "+MESES[st.mes]+" de "+st.ano;
  const itens=lista.length?lista.map(itemRes).join(""):
    aviso("ok",st.dia?"Nenhuma reserva neste dia.":"Nenhuma reserva neste mês.");
  const chips=["Todos"].concat(ESPACOS).map(f=>'<button class="chip '+(st.filtro===f?"on":"")+'" onclick="setFiltro(\''+f+'\')">'+f+'</button>').join("");
  return cardConfirmacao()+aviso("info","As reservas são feitas <b>somente pelo grupo de WhatsApp</b>. Sem limite por morador e sem taxa. Piscina, parquinho e academia <b>não</b> têm reserva.").replace('class="aviso info"','class="aviso info" style="margin:0 0 14px"')+
  '<div class="chips">'+chips+'</div>'+
  '<div class="nav"><button onclick="mudarMes(-1)" aria-label="Mês anterior">'+ic("prev",22)+'</button>'+
  '<select id="selMes" onchange="setMesAno()">'+MESES.map((m,i)=>'<option value="'+i+'"'+(i===st.mes?" selected":"")+'>'+m+'</option>').join("")+'</select>'+
  '<select id="selAno" onchange="setMesAno()">'+anos.map(a=>'<option'+(a===st.ano?" selected":"")+'>'+a+'</option>').join("")+'</select>'+
  '<button onclick="mudarMes(1)" aria-label="Próximo mês">'+ic("prox",22)+'</button></div>'+
  '<div class="cal">'+cells+'</div>'+
  '<h3 class="sec" id="listaRes">'+titLista+'</h3>'+itens+
  (statusAgenda?'<p class="muted">'+esc(statusAgenda)+'</p>':'')+
  '<div class="card" style="margin-top:18px"><div class="cardhead">'+chipic("agenda",true)+'<h3>Quero reservar</h3></div><p class="muted" style="margin:0">Preencha e toque em <b>Salvar reserva</b>: ela aparece no calendário e você recebe a mensagem pronta para enviar no grupo.</p>'+
  '<label>O que você quer reservar?</label><select id="rs_esp" onchange="checaReserva()">'+ESPACOS.map(e=>'<option>'+e+'</option>').join("")+'</select>'+
  '<label>Dia</label><input type="date" id="rs_data" min="'+key(hoje.getFullYear(),hoje.getMonth(),hoje.getDate())+'" onchange="checaReserva()">'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Início</label><input type="time" id="rs_ini" onchange="checaReserva()"></div><div><label>Término</label><input type="time" id="rs_fim" onchange="checaReserva()"></div></div>'+
  '<label>Seu nome ou número da casa</label><input id="rs_quem" placeholder="Ex.: Maria – Casa 12" oninput="checaReserva()">'+
  '<label>Observação (opcional)</label><input id="rs_obs" placeholder="Ex.: aniversário, cerca de 30 pessoas">'+
  '<div id="rs_aviso"></div>'+
  '<div class="row"><button class="btn full" style="width:100%" onclick="salvarReserva()">'+ic("ok",18)+'Salvar reserva</button></div></div>';
}
function dadosReserva(){return{esp:$("rs_esp").value,data:$("rs_data").value,ini:$("rs_ini").value,fim:$("rs_fim").value,quem:$("rs_quem").value.trim(),obs:$("rs_obs").value.trim()}}
function checaReserva(){
  const d=dadosReserva();let h="";
  if(d.data&&d.ini&&d.fim){
    if(d.fim<=d.ini)h=aviso("no","O horário de término precisa ser depois do início.");
    else if(d.esp!=="Outro"){
      const c=todas().filter(r=>r.espaco===d.esp&&r.data===d.data&&d.ini<r.fim&&r.inicio<d.fim);
      h=c.length?aviso("av","Já existe reserva neste espaço, neste dia, entre "+esc(c[0].inicio)+" e "+esc(c[0].fim)+". Escolha outro horário."):aviso("ok","Horário livre na agenda.");
    }
  }
  $("rs_aviso").innerHTML=h;
}
function salvarReserva(){
  const d=dadosReserva();
  if(!d.data||!d.ini||!d.fim||!d.quem){alert("Preencha o dia, o início, o término e seu nome ou casa.");return}
  if(d.fim<=d.ini){alert("O horário de término precisa ser depois do início.");return}
  if(d.esp!=="Outro"){
    const c=todas().filter(r=>r.espaco===d.esp&&r.data===d.data&&d.ini<r.fim&&r.inicio<d.fim);
    if(c.length){alert("Esse espaço já está reservado nesse dia entre "+c[0].inicio+" e "+c[0].fim+". Escolha outro horário.");return}
  }
  const nova={data:d.data,inicio:d.ini,fim:d.fim,espaco:d.esp,quem:d.quem,obs:d.obs,local:true,id:Date.now()};
  locais.push(nova);salvarLocais();
  const p=d.data.split("-");st.ano=+p[0];st.mes=+p[1]-1;st.dia=d.data;st.filtro="Todos";
  confirmacao={texto:msgMes(st.ano,st.mes,nova)};
  render();window.scrollTo(0,0);
}

function vBuscar(){
  const v=buscaInicial;buscaInicial="";
  return '<input id="q" type="search" value="'+esc(v)+'" placeholder="Digite: cachorro, reforma, domingo…" oninput="buscar()" autocomplete="off">'+

function buscar(){
  const q=norm($("q").value).trim();const out=$("res");
  if(!q){out.innerHTML='<p class="muted">Digite uma palavra ou toque em uma sugestão.</p>';return}
  const toks=q.split(/\s+/).filter(t=>t.length>1);
  const achados=[];
  REGRAS.forEach(g=>g.itens.forEach(i=>{
    const alvo=norm(i.t+" "+i.p+" "+g.tema),corpo=norm(i.x);let s=0;
    toks.forEach(t=>{if(alvo.indexOf(t)>=0)s+=3;else if(corpo.indexOf(t)>=0)s+=1});
    if(s>0)achados.push({s,g,i});
  }));
  achados.sort((a,b)=>b.s-a.s);
  out.innerHTML=achados.length?achados.slice(0,8).map(a=>'<div class="card"><div class="cardhead">'+chipic(a.g.icone,true)+'<span class="muted">'+esc(a.g.tema)+'</span></div>'+itemRegra(a.i).replace('class="regra"','class="regra" style="border-top:0;padding-top:0"')+'</div>').join(""):
   aviso("av","Não encontrei isso na cartilha.")+'<div class="row"><a class="btn zap" target="_blank" href="'+waLink("Olá! Tenho uma dúvida sobre o condomínio: "+$("q").value,CONFIG.whatsappSindico)+'">'+ic("chat",18)+'Perguntar ao síndico</a></div>';
}

/* ---------- Posso agora? ---------- */
function respostas(){
  const n=new Date(),dia=n.getDay(),h=n.getHours()+n.getMinutes()/60,util=dia>=1&&dia<=5;
  const R=[];
  let b;
  if(h<6||h>=22)b=["no","Não","Horário de silêncio: das 22h às 6h, todos os dias."];
  else if(dia===0)b=["no","Não","Aos domingos são proibidos maquinário e ruídos intensos, e sons altos em residências não são autorizados."];
  else if(dia===6&&h>=12)b=["no","Não","Aos sábados à tarde são proibidos maquinário e ruídos intensos, e sons altos em residências não são autorizados."];
  else if(h>=8&&h<18&&util)b=["ok","Sim, com bom senso","Obras e barulhos moderados são permitidos nos dias úteis, das 8h às 18h."];
  else if(dia===6)b=["av","Com cuidado","A cartilha restringe ruídos intensos só aos sábados à tarde. Pela manhã, mantenha o bom senso."];
  else b=["av","Evite","Fora do horário de 8h às 18h, evite obras e barulhos e mantenha o volume baixo, respeitando os vizinhos."];
  R.push(["obra","Posso fazer obra ou barulho agora?"].concat(b));
  let l;
  if(dia===0)l=["no","Não","Aos domingos é proibido descartar lixo comum. Aguarde a segunda-feira, até as 14h."];
  else if(dia===6)l=h<8?["ok","Sim","Aos sábados o lixo pode ser colocado até as 8h, em sacos bem fechados."]:["no","Não","Aos sábados o lixo só pode ser colocado até as 8h. Aguarde a segunda-feira, até as 14h."];
  else l=h<14?["ok","Sim","Nos dias úteis o lixo pode ser colocado até as 14h, em sacos bem fechados."]:["no","Não","Hoje o horário já passou (até 14h). Coloque amanhã de manhã, em sacos bem fechados."];
  R.push(["lixo","Posso colocar o lixo agora?"].concat(l));
  let p;
  if(h<6||h>=22)p=["no","Não","Horário de silêncio, das 22h às 6h."];
  else if(dia===6)p=h<10?["av","Ainda não","Aos sábados a piscina é liberada a partir das 10h, depois da limpeza."]:["ok","Provavelmente sim","Aos sábados está liberada a partir das 10h. Confira o quadro de avisos da piscina."];
  else if(dia===1)p=["av","Confira","Segunda-feira é dia de limpeza da piscina. Veja o quadro de avisos da piscina."];
  else p=["av","Confira o quadro","Os horários de funcionamento estão no quadro de avisos da piscina."];
  p[2]+=" Lembre: ducha antes, nada de vidro e crianças menores de 12 anos sempre com adulto.";
  R.push(["piscina","Posso usar a piscina agora?"].concat(p));
  let m;
  if(h<6||h>=22)m=["no","Não","Horário de silêncio, das 22h às 6h."];
  else if(dia>=1&&dia<=6&&h<12)m=["ok","Sim","Segunda a sábado, pela manhã, é o horário preferencial para mudanças."];
  else m=["av","Só sem ruído","O horário preferencial é de segunda a sábado, pela manhã. Em outros horários só se a mudança não causar barulho."];
  R.push(["mudanca","Posso fazer mudança agora?"].concat(m));
  const lim=(dia===1||dia===3||dia===5)&&h>=17&&h<19;
  R.push(["limpeza","A equipe de limpeza está no condomínio?",lim?"ok":"av",lim?"Sim":"Agora não",lim?"A limpeza trabalha hoje até as 19h.":"A equipe trabalha às segundas, quartas e sextas, das 17h às 19h."]);
  return R;
}
function vAgora(){
  const n=new Date();
  return '<div class="agora">'+ic("agora",26)+'<div><small>Agora</small><b>'+DIAS[n.getDay()]+', '+pad(n.getHours())+':'+pad(n.getMinutes())+'</b></div></div>'+
  respostas().map(r=>'<div class="card"><div class="cardhead">'+chipic(r[0],true)+'<h3>'+r[1]+'</h3></div><span class="badge '+r[2]+'">'+ic(r[2],15)+r[3]+'</span><div>'+esc(r[4])+'</div></div>').join("")+
  '<p class="muted">As respostas usam o dia e a hora do seu celular e seguem a Cartilha de Boa Convivência.</p>';
}

  '<a class="btn zap" target="_blank" href="'+waLink("Olá, síndico! Tenho uma dúvida sobre o condomínio.",CONFIG.whatsappSindico)+'">'+ic("chat",18)+'Chamar o síndico</a>'+
  '<a class="btn sec" target="_blank" href="'+waLink("Olá, síndico! Gostaria de ser adicionado(a) ao grupo de reservas.",CONFIG.whatsappSindico)+'">Entrar no grupo de reservas</a></div></div>';
